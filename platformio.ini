[platformio]
default_envs = d1_mini

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
extra_scripts =
  pre:tools/embed_web.py
  pre:tools/configure_ota.py
  post:tools/ota_upload.py
upload_speed = 460800
build_src_filter = +<*> -<led_test.cpp>
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  adafruit/Adafruit NeoPixel@1.12.3
  adafruit/Adafruit NeoMatrix@1.3.3
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.16.2
  adafruit/Adafruit BMP280 Library@2.6.8
  adafruit/Adafruit Unified Sensor@1.1.14
build_flags = -Wall -Wextra

; Diagnostico independiente: no usa WiFi, LittleFS, servidor ni fuentes.
; Cargar: pio run -e led-test -t upload
[env:led-test]
extends = env:nodemcuv2
build_src_filter = -<*> +<led_test.cpp>

; Placa real confirmada: Wemos/LOLIN D1 mini, ESP8266.
[env:d1_mini]
extends = env:nodemcuv2
board = d1_mini
upload_speed = 115200

; Actualizaciones por WiFi: host y contraseña en ota.local.json (privado).
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/http_ota_upload.py" "$SOURCE"

; OTA clasica; requiere conexion TCP desde el ESP al ordenador.
[env:d1_mini_ota_native]
extends = env:d1_mini
upload_protocol = espota
